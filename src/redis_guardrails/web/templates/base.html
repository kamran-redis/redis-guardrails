<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}redis_guardrails{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark">rg</span>
            <span class="brand-name">redis_guardrails</span>
        </div>
        <nav>
            <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Home</a>
            <a href="/prompts/evaluate" class="{{ 'active' if request.url.path.startswith('/prompts') else '' }}">Run Prompt</a>
            <a href="/benchmarks" class="{{ 'active' if request.url.path.startswith('/benchmarks') else '' }}">Benchmarks</a>
            <a href="/guardrails" class="{{ 'active' if request.url.path.startswith('/guardrails') else '' }}">Guardrails</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('form.loading-form').forEach(function (form) {
        form.addEventListener('submit', function () {
          var btn = form.querySelector('button[type="submit"]');
          if (btn) { btn.disabled = true; btn.textContent = 'Working…'; }
        });
      });
    });
    </script>
</body>
</html>
